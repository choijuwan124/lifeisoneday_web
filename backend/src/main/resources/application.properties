spring.application.name=lifeisoneday
server.port=8080
spring.config.import=optional:classpath:application-local.properties
# 5 MiB file plus multipart boundaries and headers. The photo service also validates bytes/type.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=8MB
# Resolve relative to the backend working directory; never serve this directory as static files.
app.upload.directory=${DIARY_UPLOAD_DIR:../.local/uploads}
