<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>친구 초대 | Life Is One Day</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script>
      // 친구 초대 기능은 member-manage.html로 통합되었습니다. 기존 링크의 groupId를 그대로 넘깁니다.
      (function () {
        var target = new URL("member-manage.html", window.location.href);
        var groupId = new URLSearchParams(window.location.search).get("groupId");
        if (groupId) target.searchParams.set("groupId", groupId);
        window.location.replace(target.href);
      })();
    </script>
  </head>
  <body>
    <main class="hero">
      <p class="eyebrow">SHARED DIARY</p>
      <p>멤버 관리 화면으로 이동하고 있습니다.</p>
      <p><a href="member-manage.html">이동하지 않으면 여기를 눌러 주세요.</a></p>
    </main>
  </body>
</html>
