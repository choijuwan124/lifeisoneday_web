<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>단체 일기장 만들기 | Life Is One Day</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="../index.html">Life Is One Day</a>
    </header>

    <main>
      <section class="hero" aria-labelledby="group-create-title">
        <p class="eyebrow">SHARED DIARY</p>
        <h1 id="group-create-title">단체 일기장 만들기</h1>

        <form>
          <p>
            <label for="diary-name">일기장 이름</label><br />
            <input id="diary-name" name="name" type="text" />
          </p>
          <p>
            <label for="diary-description">일기장 설명</label><br />
            <textarea id="diary-description" name="description" rows="5"></textarea>
          </p>
          <button class="button" type="button">만들기</button>
        </form>

        <p><a href="group-list.html">목록으로 돌아가기</a></p>
      </section>
    </main>
  </body>
</html>
