<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 | Life Is One Day</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="auth.css" />
    <script src="../js/api.js" defer></script>
    <script src="../js/app.js" defer></script>
    <script src="../auth/logout.js" defer></script>
    <script src="login.js" defer></script>
  </head>
  <body class="auth-page">
    <header class="site-header">
      <a class="logo" href="../index.html">Life Is One Day</a>
      <nav aria-label="주요 메뉴">
        <a href="signup.html">회원가입</a>
      </nav>
    </header>

    <main class="auth-main">
      <section class="auth-card" aria-labelledby="login-title">
        <p class="eyebrow">SHARED DIARY</p>
        <h1 id="login-title">다시 만나서 반가워요.</h1>
        <p class="auth-description">아이디와 비밀번호를 입력해 일기장으로 들어가세요.</p>

        <noscript>
          <p class="auth-message">로그인하려면 브라우저에서 JavaScript를 켜 주세요.</p>
        </noscript>

        <form id="login-form" method="post" aria-describedby="login-message">
          <div class="auth-field">
            <label for="username">아이디</label>
            <input id="username" name="username" type="text" autocomplete="username"
                   maxlength="50" required />
          </div>
          <div class="auth-field">
            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" autocomplete="current-password"
                   maxlength="128" required />
          </div>
          <button id="login-submit" class="button auth-submit" type="submit" disabled>로그인</button>
        </form>

        <p id="login-message" class="auth-message" role="status" aria-live="polite" aria-atomic="true"></p>
        <p class="field-help">계정이 없다면 <a href="signup.html">회원가입</a>을 먼저 해 주세요.</p>
      </section>
    </main>
  </body>
</html>
